<style>

const movieContainer = document.getElementById('movies');

movies.forEach(movie => {
    const div = document.createElement('div');
    div.className = 'movie-container';
    div.innerHTML = `
        <div class='poster'>
            <a href='${movie.poster}' target='_blank'><img src='${movie.poster}' alt='${movie.name} poster'></a>
            <a href='${movie.trailer}' target='_blank'><img class='youtube-icon' src='https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png' alt='YouTube'></a>
        </div>
        <div class='movie-details'>
            <div class='movie-title'>${movie.name || ''}</div>
            <div class='info'><strong>Status:</strong> ${movie.status || ''}</div>
            <div class='info'><strong>Genre:</strong> ${movie.genre || ''}</div>
            <div class='synopsis'>${movie.synopsis || ''}</div>
            <div class='info'><strong>Cast:</strong> ${movie.cast.join(', ')}</div>
            <div class='info'><strong>Runtime:</strong> ${movie.runtime || ''}</div>
            <div class='poster-link'><a href='${movie.poster}' target='_blank'>View Poster</a></div>
        </div>
    `;
    movieContainer.appendChild(div);
});
