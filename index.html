<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>iNi Cinemas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --warning-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      --danger-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      
      --bg-light: #ffffff;
      --bg-light-secondary: #f8fafc;
      --bg-dark: #0f0f23;
      --bg-dark-secondary: #1a1a2e;
      --bg-card-light: #ffffff;
      --bg-card-dark: #16213e;
      
      --text-light: #1e293b;
      --text-light-secondary: #64748b;
      --text-dark: #f8fafc;
      --text-dark-secondary: #cbd5e1;
      
      --border-light: #e2e8f0;
      --border-dark: #334155;
      
      --shadow-light: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-dark: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
      
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      line-height: 1.6;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-x: hidden;
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    body.dark::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 0;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .toggle-btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 50px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: inherit;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid var(--glass-border);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    /* Slider Styles */
    .slider-container {
      max-width: 1400px;
      margin: 2rem auto;
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: var(--shadow-light);
      border: 1px solid var(--glass-border);
    }

    body.dark .slider-container {
      box-shadow: var(--shadow-dark);
    }

    .slider-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .slider-header h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .slider {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      margin: 0 -1rem;
    }

    .slider-wrapper {
      display: flex;
      transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    .slide {
      min-width: 280px;
      height: 420px;
      margin: 0 1rem;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      transform: scale(0.85);
      transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .slide.active {
      transform: scale(1);
      box-shadow: 0 16px 64px rgba(0, 0, 0, 0.2);
    }

    .slide:not(.active) {
      filter: brightness(0.7) saturate(0.8);
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .slide:hover img {
      transform: scale(1.05);
    }

    .slide-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      padding: 1.5rem;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slide:hover .slide-overlay,
    .slide.active .slide-overlay {
      transform: translateY(0);
    }

    .movie-title {
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
    }

    .movie-genre {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      font-weight: 400;
    }

    .movie-status {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-now-showing {
      background: var(--danger-gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(250, 112, 154, 0.4);
    }

    .status-coming-soon {
      background: var(--warning-gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(67, 233, 123, 0.4);
    }

    .status-next-release {
      background: var(--success-gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }

    .navigation {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      user-select: none;
    }

    .navigation:hover {
      transform: translateY(-50%) scale(1.1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .nav-prev {
      left: -28px;
    }

    .nav-next {
      right: -28px;
    }

    .dots-container {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dot.active {
      background: var(--primary-gradient);
      transform: scale(1.3);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .movie-info {
      text-align: center;
      margin-top: 2rem;
      padding: 1.5rem;
      background: var(--glass-bg);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
    }

    .current-movie-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: var(--secondary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .current-movie-release,
    .current-movie-runtime {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 0.25rem;
    }

    /* Movies Container */
    .movies-container {
      max-width: 1400px;
      margin: 3rem auto;
      padding: 0 2rem;
      display: grid;
      gap: 2rem;
    }

    .movie-card {
      background: var(--bg-card-light);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: var(--shadow-light);
      border: 1px solid var(--border-light);
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 1.5rem;
      align-items: flex-start;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    body.dark .movie-card {
      background: var(--bg-card-dark);
      box-shadow: var(--shadow-dark);
      border-color: var(--border-dark);
    }

    .movie-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary-gradient);
      transform: scaleX(0);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .movie-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    body.dark .movie-card:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .movie-card:hover::before {
      transform: scaleX(1);
    }

    .movie-poster img {
      width: 140px;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .movie-card:hover .movie-poster img {
      transform: scale(1.05);
    }

    .movie-info h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: inherit;
    }

    .status {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status.now-showing {
      background: var(--danger-gradient);
      color: white;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .genre {
      color: var(--text-light-secondary);
      font-style: italic;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    body.dark .genre {
      color: var(--text-dark-secondary);
    }

    .synopsis-container {
      position: relative;
      margin-bottom: 1rem;
    }

    .synopsis {
      color: var(--text-light-secondary);
      line-height: 1.6;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    body.dark .synopsis {
      color: var(--text-dark-secondary);
    }

    .synopsis.expanded {
      -webkit-line-clamp: unset;
      display: block;
    }

    .show-more {
      color: #667eea;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      margin-left: 0.5rem;
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    .show-more:hover {
      color: #764ba2;
    }

    .cast, .runtime, .director, .release_on, .grade {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: inherit;
      opacity: 0.9;
    }

    .cast strong,
    .runtime strong,
    .director strong,
    .release_on strong,
    .grade strong {
      color: #667eea;
      font-weight: 600;
    }

    .trailer {
      margin-top: 1rem;
    }

    .trailer a img {
      width: 36px;
      height: auto;
      border-radius: 8px;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .trailer a img:hover {
      transform: scale(1.1);
    }

    /* Responsive Design */
    @media (max-width: 1200px) {
      .slider-container {
        margin: 2rem 1rem;
        padding: 1.5rem;
      }
      
      .movies-container {
        padding: 0 1rem;
      }
    }

    @media (max-width: 768px) {
      .header-content {
        padding: 0 1rem;
      }
      
      .logo {
        font-size: 1.5rem;
      }
      
      .toggle-btn {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
      }
      
      .slider-container {
        margin: 1rem 0.5rem;
        padding: 1rem;
      }
      
      .slide {
        min-width: 220px;
        height: 330px;
        margin: 0 0.5rem;
      }

      .navigation {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }

      .nav-prev {
        left: -22px;
      }

      .nav-next {
        right: -22px;
      }
      
      .movie-card {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 1rem;
        padding: 1rem;
      }
      
      .movie-poster img {
        width: 120px;
        height: 180px;
        margin: 0 auto;
      }
      
      .movies-container {
        margin: 2rem auto;
        padding: 0 0.5rem;
      }
    }

    @media (max-width: 480px) {
      .slide {
        min-width: 180px;
        height: 280px;
      }
      
      .movie-title {
        font-size: 1rem;
      }
      
      .current-movie-title {
        font-size: 1.2rem;
      }
      
      .movie-poster img {
        width: 100px;
        height: 150px;
      }
      
      .movie-card {
        padding: 0.75rem;
      }
    }

    /* Loading Animation */
    @keyframes shimmer {
      0% {
        background-position: -200px 0;
      }
      100% {
        background-position: calc(200px + 100%) 0;
      }
    }

    .loading {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200px 100%;
      animation: shimmer 1.5s infinite;
    }

    body.dark .loading {
      background: linear-gradient(90deg, #2a2a2a 25%, #1a1a1a 50%, #2a2a2a 75%);
      background-size: 200px 100%;
    }
  </style>
</head>

    // Javascript for slider
    let currentIndex = 0;
    const slidesPerView = 3;
    const totalSlides = movies.length;

    function getStatusClass(status) {
        return status.toLowerCase().replace(/\s+/g, '-');
    }

    function createSlides() {
        const sliderWrapper = document.getElementById('sliderWrapper');
        const dotsContainer = document.getElementById('dotsContainer');
        
        sliderWrapper.innerHTML = '';
        dotsContainer.innerHTML = '';

        movies.forEach((movie, index) => {
            // Create slide
            const slide = document.createElement('div');
            slide.className = `slide ${index === currentIndex ? 'active' : ''}`;
            
            slide.innerHTML = `
                <img src="${movie.poster}" alt="${movie.name}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQ1MCIgdmlld0JveD0iMCAwIDMwMCA0NTAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMDAiIGhlaWdodD0iNDUwIiBmaWxsPSIjMjEyMTIxIi8+Cjx0ZXh0IHg9IjE1MCIgeT0iMjI1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNzc3IiBmb250LXNpemU9IjE2Ij5Ob1BPc3RlclBPc3RlcjwvdGV4dD4KPC9zdmc+'">
                <div class="slide-overlay">
                    <div class="movie-title">${movie.name}</div>
                    <div class="movie-genre">${movie.genre}</div>
                    <div class="movie-status status-${getStatusClass(movie.status)}">${movie.status}</div>
                </div>
            `;

            slide.addEventListener('click', () => {
                currentIndex = index;
                updateSlider();
            });

            sliderWrapper.appendChild(slide);

            // Create dot
            const dot = document.createElement('div');
            dot.className = `dot ${index === currentIndex ? 'active' : ''}`;
            dot.addEventListener('click', () => {
                currentIndex = index;
                updateSlider();
            });
            dotsContainer.appendChild(dot);
        });
    }

    function updateSlider() {
        const sliderWrapper = document.getElementById('sliderWrapper');
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        // Update slider position
        const slideWidth = window.innerWidth <= 768 ? 240 : (window.innerWidth <= 480 ? 200 : 300);
        const offset = -currentIndex * slideWidth + (sliderWrapper.parentElement.clientWidth / 2) - (slideWidth / 2);
        sliderWrapper.style.transform = `translateX(${offset}px)`;

        // Update active states
        slides.forEach((slide, index) => {
            slide.classList.toggle('active', index === currentIndex);
        });

        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
        });

        // Update movie info
        updateMovieInfo();
    }

    function updateMovieInfo() {
        const movie = movies[currentIndex];
        document.getElementById('currentTitle').textContent = movie.name;
        document.getElementById('currentRelease').textContent = `Release Date: ${movie.release_on}`;
        document.getElementById('currentRuntime').textContent = `Runtime: ${movie.runtime}`;
    }

    function nextSlide() {
        currentIndex = (currentIndex + 1) % totalSlides;
        updateSlider();
    }

    function prevSlide() {
        currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
        updateSlider();
    }

    // Event listeners
    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') prevSlide();
        if (e.key === 'ArrowRight') nextSlide();
    });

    // Auto-play functionality
    let autoPlayInterval;

    function startAutoPlay() {
        autoPlayInterval = setInterval(nextSlide, 5000);
    }

    function stopAutoPlay() {
        clearInterval(autoPlayInterval);
    }

    // Pause auto-play on hover
    const slider = document.getElementById('movieSlider');
    slider.addEventListener('mouseenter', stopAutoPlay);
    slider.addEventListener('mouseleave', startAutoPlay);

    // Touch/swipe support for mobile
    let touchStartX = 0;
    let touchEndX = 0;

    slider.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    });

    slider.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    });

    function handleSwipe() {
        if (touchEndX < touchStartX - 50) {
            nextSlide();
        }
        if (touchEndX > touchStartX + 50) {
            prevSlide();
        }
    }

    // Initialize
    createSlides();
    updateSlider();
    startAutoPlay();

    // Handle window resize
    window.addEventListener('resize', () => {
        updateSlider();
    });
    
    // Movies container population
    const container = document.getElementById('movies-container');

    movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';

        // Poster
        const posterDiv = document.createElement('div');
        posterDiv.className = 'movie-poster';
        const posterLink = document.createElement('a');
        posterLink.href = movie.poster;
        posterLink.target = '_blank';
        posterLink.innerHTML = `<img src="${movie.poster}" alt="${movie.name}" loading="lazy">`;
        posterDiv.appendChild(posterLink);

        // Info
        const infoDiv = document.createElement('div');
        infoDiv.className = 'movie-info';

        // Build conditional fields
        let extraFields = "";

        // Show Director only if NOT "NOW SHOWING"
        if (movie.status !== "NOW SHOWING" && movie.director) {
            extraFields += `<div class="director"><strong>Director:</strong> ${movie.director}</div>`;
        }

        // Show Grade only if "NOW SHOWING"
        if (movie.status === "NOW SHOWING" && movie.grade) {
            extraFields += `<div class="grade"><strong>Grade:</strong> ${movie.grade}</div>`;
        }

        // Wrap synopsis and button together
        infoDiv.innerHTML = `
            <div class="status ${movie.status === "NOW SHOWING" ? "now-showing" : ""}">${movie.status}</div>
            <h2>${movie.name}</h2>
            <div class="genre">${movie.genre}</div>
            <div class="synopsis-container">
                <p class="synopsis">${movie.synopsis}</p>
                <span class="show-more" style="display:none;">Show More</span>
            </div>
            <div class="cast"><strong>Cast:</strong> ${movie.cast.join(", ")}</div>
            <div class="runtime"><strong>Runtime:</strong> ${movie.runtime}</div>
            ${extraFields}
            <div class="release_on"><strong>Release Date:</strong> ${movie.release_on}</div>
            <div class="trailer">
                <a href="${movie.trailer}" target="_blank" aria-label="Watch ${movie.name} trailer">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" 
                         alt="YouTube Icon" width="36" loading="lazy">
                </a>
            </div>
        `;

        // Toggle "Show More / Show Less" only if truncated
        const synopsisEl = infoDiv.querySelector(".synopsis");
        const toggleEl = infoDiv.querySelector(".show-more");

        // Run after DOM paint to check height
        requestAnimationFrame(() => {
            if (synopsisEl.scrollHeight > synopsisEl.clientHeight) {
                toggleEl.style.display = "inline";
            }
        });

        toggleEl.addEventListener("click", () => {
            synopsisEl.classList.toggle("expanded");
            toggleEl.textContent = synopsisEl.classList.contains("expanded")
                ? "Show Less"
                : "Show More";
        });

        card.appendChild(posterDiv);
        card.appendChild(infoDiv);
        container.appendChild(card);
    });

    // Toggle dark/light mode
    const toggleBtn = document.getElementById('toggleMode');
    const toggleIcon = toggleBtn.querySelector('span');
    const toggleText = toggleBtn.childNodes[2];

    // Check for saved theme preference
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        document.body.classList.add('dark');
        toggleIcon.textContent = '☀️';
        toggleText.textContent = ' Light Mode';
    }

    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        
        toggleIcon.textContent = isDark ? '☀️' : '🌙';
        toggleText.textContent = isDark ? ' Light Mode' : ' Dark Mode';
        
        // Save theme preference
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // Smooth scroll behavior
    document.documentElement.style.scrollBehavior = 'smooth';

    // Add intersection observer for fade-in animations
    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0)';
            }
        });
    }, observerOptions);

    // Observe movie cards for animation
    document.querySelectorAll('.movie-card').forEach(card => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(30px)';
        card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        observer.observe(card);
    });

  </script>
