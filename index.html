  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 20px;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }

    /* Dark mode */
    body.dark {
      background: #121212;
      color: #fff; /* white text */
    }
    body.dark .movie-card {
  background: #1e1e1e;
}

body.dark .movie-info h2,
body.dark .genre,
body.dark .synopsis,
body.dark .cast,
body.dark .runtime,
body.dark .director,
body.dark .release_on,
body.dark .grade {
  color: #fff; /* force white */
}
    body.dark h1 {
      color: #fff;
    }

    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .toggle-btn:hover {
      background: #555;
    }

    .movie-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 16px;
      align-items: flex-start;
      transition: background 0.3s;
    }
    .movie-poster img {
      width: 120px;
      height: auto;
      border-radius: 8px;
    }
    .movie-info h2 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: bold;
    }
    .status {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #666;
    }

    /* Animate NOW SHOWING */
    .status.now-showing {
      color: #e63946;
      animation: moveRight 1.5s infinite;
    }
    @keyframes moveRight {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(8px); }
      100% { transform: translateX(0); }
    }

    .genre {
      color: #444;
      font-style: italic;
    }
    .synopsis {
      margin: 8px 0;
      color: #555;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .cast, .runtime, .director, .release_on, .grade {
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 6px; /* adds spacing between each line */
    }
    .trailer {
      margin-top: 8px;
      text-align: left;
    }
    .trailer a img {
      width: 28px;
      height: auto;
      border-radius: 6px;
    }
  </style>
</head>

    const container = document.getElementById('movies-container');

    movies.forEach(movie => {
    const card = document.createElement('div');
    card.className = 'movie-card';

    // Poster
    const posterDiv = document.createElement('div');
    posterDiv.className = 'movie-poster';
    const posterLink = document.createElement('a');
    posterLink.href = movie.poster;
    posterLink.target = '_blank';
    posterLink.innerHTML = `<img src="${movie.poster}" alt="${movie.name}">`;
    posterDiv.appendChild(posterLink);

    // Info
    const infoDiv = document.createElement('div');
    infoDiv.className = 'movie-info';

    // Build conditional fields
    let extraFields = "";

    // Show Director only if NOT "NOW SHOWING"
    if (movie.status !== "NOW SHOWING") {
      extraFields += `<div class="director"><strong>Director:</strong> ${movie.director}</div>`;
    }

    // Show Grade only if NOT "NEXT RELEASE" or "COMING SOON"
    if (movie.status === "NOW SHOWING") {
      extraFields += `<div class="grade"><strong>Grade:</strong> ${movie.grade}</div>`;
    }

    infoDiv.innerHTML = `
      <div class="status ${movie.status === "NOW SHOWING" ? "now-showing" : ""}">${movie.status}</div>
      <h2>${movie.name}</h2>
      <div class="genre">${movie.genre}</div>
      <p class="synopsis">${movie.synopsis}</p>
      <div class="cast"><strong>Cast:</strong> ${movie.cast}</div>
      <div class="runtime"><strong>Runtime:</strong> ${movie.runtime}</div>
      ${extraFields}
      <div class="release_on"><strong>Release on:</strong> ${movie.release_on}</div>
      <div class="trailer">
        <a href="${movie.trailer}" target="_blank">

               alt="YouTube Icon" width="50">
        </a>
      </div>
    `;

    card.appendChild(posterDiv);
    card.appendChild(infoDiv);
    container.appendChild(card);

  // Toggle dark/light mode

    document.body.classList.toggle('dark');
